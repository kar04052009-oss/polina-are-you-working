          реплика: Ого, вот это скорость! Тогда до скорой встречи в сообщениях.
          эмоция: surprised
    - эмоция: smile
      вопрос: Надеюсь, ещё увидимся?
      ответы:
        - текст: Обязательно!
          реплика: Договорились! Буду ждать.
          эмоция: smile
        - текст: Я ещё подумаю
          реплика: АХАХ, конечно. Не тороплю. Я человек терпеливый. Иногда.
          эмоция: laugh
        - текст: Уже пишу тебе
          реплика: Ого, вот это скорость! Тогда до скорой встречи в сообщениях.
          эмоция: surprised

# Реакции на поведение гостя
реакции:
  # Сначала вопрос, при повторной тишине — обычные реплики, потом снова вопрос.
  # Между репликами о тишине — не меньше минуты.
  долгая тишина:
    - эмоция: sly
      вопрос: Ты там не уснул?
      ответы:
        - текст: Я тут!
          реплика: АХАХ, ну и хорошо. А то я уже собиралась проверить.
          эмоция: laugh
        - текст: Задумался
          реплика: Бывает. У меня такое тоже случается. Особенно когда нужно придумать название проекта.
          эмоция: thinking
        - текст: Просто любуюсь комнатой
          реплика: Ой, спасибо! Тогда продолжай, я не против.
          эмоция: embarrassed
    - эмоция: smile
      текст: Не торопись, я пока посижу тут.
    - эмоция: tired
      текст: Кажется, мы оба немного зависли.
    - эмоция: sly
      текст: Так, у нас тут медитация или что?

  снова осмотр:
    - эмоция: sly
      текст: Опять исследуешь мои владения?
    - эмоция: laugh
      текст: Кажется, ты уже знаешь эту комнату лучше меня.
    - эмоция: curious
      текст: Нашёл что-нибудь интересное?
  много кликов:
    - эмоция: laugh
      текст: АХАХ, тебе всё интересно.
    - эмоция: sly
      текст: Так, я смотрю, ты решил проверить здесь каждый пиксель.
    - эмоция: laugh
      текст: Ну всё, теперь ты официальный исследователь моей комнаты.
