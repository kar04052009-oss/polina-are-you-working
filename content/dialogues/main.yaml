# Сценарий сайта «Полина, ты работаешь?»
#
# Как устроен файл:
# - «сцена» — список реплик, которые идут подряд;
# - «эмоция» — имя файла спрайта без .png (neutral, smile, thinking…);
#   если не указать, остаётся прежняя эмоция;
# - «вопрос» с «ответами» показывает кнопки выбора;
# - ответ ведёт либо в другую сцену («дальше: имя сцены»),
#   либо в раздел («раздел: портфолио», «обо мне» или «контакты»);
# - строки с решёткой — комментарии, сайт их не читает.
#
# Всё, что помечено ЧЕРНОВИК, — пример. Замени тексты на свои.

начало: знакомство          # с какой сцены начинаем для нового гостя
повторный визит: снова ты   # с какой сцены начинаем, если гость вернулся

сцены:
  знакомство:
    # Реплика из старого файла
    - эмоция: smile
      текст: Привет! Сайт пока строится, но скоро здесь будет моя комната. Загляни попозже!
    # ЧЕРНОВИК
    - текст: Я Полина, графический дизайнер. Это моя комната — тут немного творческий беспорядок.
    # ЧЕРНОВИК
    - эмоция: thinking
      вопрос: Куда заглянем?
      ответы:
        - текст: Покажи работы
          раздел: портфолио
        - текст: Расскажи о себе
          раздел: обо мне
        - текст: Сначала осмотрюсь
          дальше: осмотр

  # ЧЕРНОВИК
  осмотр:
    - эмоция: smile
      текст: Кликай на всё, что покажется интересным.

  # ЧЕРНОВИК
  снова ты:
    - эмоция: smile
      вопрос: О, снова ты! Куда сегодня?
      ответы:
        - текст: Портфолио
          раздел: портфолио
        - текст: Обо мне
          раздел: обо мне
        - текст: Контакты
          раздел: контакты

# Реплики при клике на предметы (заработают на этапе 6)
пасхалки:
  # ЧЕРНОВИК
  кот:
    - текст: Это мой кот. Он главный критик всех моих работ.
  # ЧЕРНОВИК
  кружки:
    - эмоция: thinking
      текст: Третья за день… или четвёртая?
