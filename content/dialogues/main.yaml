# Сценарий сайта «Полина, ты работаешь?»
#
# Как устроен файл:
# - «сцена» — список реплик, которые идут подряд, одна за другой;
# - «эмоция» — имя картинки Полины без .png (neutral, smile, thinking…);
#   если не указать, остаётся прежняя эмоция;
# - «вопрос» с «ответами» показывает кнопки выбора;
# - ответ ведёт либо в другую сцену («дальше: имя сцены»),
#   либо в раздел («раздел: портфолио», «обо мне» или «контакты»);
# - в «пасхалках», «перед разделом», «после раздела» и «реакциях» каждая реплика —
#   отдельный вариант: на один клик звучит одна, на следующий — следующая, по кругу;
# - строки с решёткой — комментарии, сайт их не читает;
# - если в тексте есть двоеточие с пробелом («так: вот»), возьми весь текст в кавычки:
#   текст: "Люблю разное: плакаты, упаковку, книги."

начало: знакомство                # с какой сцены начинаем для нового гостя
повторный визит: снова ты         # с какой сцены начинаем, если гость вернулся
страница не найдена: не найдено   # если адрес с опечаткой; после неё — обычное начало

сцены:
  знакомство:
    # Приветствие
    - эмоция: neutral
      текст: Ой, привет!
    - эмоция: smile
      текст: Ты ко мне? Заходи, не стесняйся.
    # Знакомство
    - текст: Я Полина, графический дизайнер.
    - эмоция: laugh
      текст: Это моя комната. Здесь я работаю, рисую, придумываю всякое… и иногда просто смотрю в монитор с очень умным видом.
    # Чем занимаюсь
    - эмоция: smile
      # Текст с двоеточием внутри — в кавычках
      текст: "Вообще, я люблю работать с визуалом: придумывать фирменные стили, плакаты, упаковку, книжный дизайн и всякие интересные штуки."
    - эмоция: laugh
      текст: Но не буду устраивать тебе экскурсию на сорок минут. Лучше сама всё покажу.
    # Выбор
    - эмоция: smile
      вопрос: Ну что, куда заглянем?
      ответы:
        - текст: Покажи работы
          раздел: портфолио
        - текст: Расскажи о себе
          раздел: обо мне
        - текст: Сначала осмотрюсь
          дальше: осмотр
        - текст: Как с тобой связаться?
          раздел: контакты

  осмотр:
    - эмоция: smile
      текст: Тогда располагайся!
    - текст: Можешь покликать на разные штуки в комнате. Тут почти всё не просто так стоит.
    - эмоция: thinking
      текст: Наводи курсор на предметы — если он меняется, значит, там что-то интересное.
    - эмоция: laugh
      текст: Только кота не буди. У него и без тебя тяжёлая жизнь.

  снова ты:
    - эмоция: surprised
      текст: ОПА. Знакомые лица!
    - эмоция: smile
      вопрос: Снова ты. Ну что, куда сегодня?
      ответы:
        - текст: Портфолио
          раздел: портфолио
        - текст: Обо мне
          раздел: обо мне
        - текст: Контакты
          раздел: контакты
        - текст: Просто посижу тут
          дальше: осмотр

  не найдено:
    - эмоция: surprised
      текст: Хм… А куда это мы попали?
    - эмоция: thinking
      текст: Кажется, такой страницы у меня пока нет.
    - эмоция: smile
      текст: Но раз уж ты здесь, давай знакомиться!

# Реплики при клике на предметы — по одной на клик, по кругу (заработают на этапе 6)
пасхалки:
  кот:
    - эмоция: smile
      текст: Это Пиксель. Мой главный критик и начальник.
    - эмоция: laugh
      текст: Он, кстати, ни разу не похвалил мои работы. Очень строгий заказчик.
    - эмоция: smile
      текст: Работает меньше всех, а уважения в этой комнате больше всех.
    - эмоция: thinking
      текст: Тихо, он спит. У него сегодня очень насыщенный день — три раза сменил позу.
  кружки:
    - эмоция: thinking
      текст: Третья за день… или четвёртая? Неважно.
    - эмоция: smile
      текст: Это не беспорядок. Это система хранения кофе.
    - эмоция: embarrassed
      текст: Когда-нибудь я обязательно буду мыть кружку сразу после использования. Но не сегодня.
    - эмоция: thinking
      текст: У меня есть чистая кружка. Просто она где-то здесь.
  окно:
    - эмоция: thinking
      текст: Иногда лучший способ придумать что-то — просто немного потупить в окно.
    - эмоция: smile
      текст: Люблю это время суток. Особенно когда дедлайн не дышит мне в затылок.
    - эмоция: laugh
      текст: Красиво, да? Вот бы ещё задачи сами себя сделали.
    - эмоция: embarrassed
      текст: Тут я иногда зависаю дольше, чем планировала. Не осуждай.
  мишки:
    - эмоция: smile
      текст: Это мои маленькие коллеги. От них, кстати, меньше всего правок.
    - эмоция: thinking
      текст: У каждого здесь своя должность. Правда, я пока не придумала какая.
    - эмоция: laugh
      текст: Они следят, чтобы я не слишком зазнавалась.
    - эмоция: surprised
      текст: Не трогай, это очень важные участники творческого процесса.
  полина:
    - эмоция: surprised
      текст: Эй! Я вообще-то тут работаю!
    - эмоция: embarrassed
      текст: Что? У меня что-то на лице?
    - эмоция: thinking
      текст: Ты так и будешь на меня нажимать?
    - эмоция: laugh
      текст: АХАХ, ладно, ладно. Я тоже рада тебя видеть.
    - эмоция: thinking
      текст: Между прочим, у меня тут важная творческая деятельность происходит. Я выбираю шрифт.

# Реплика при клике на монитор, мудборд или смартфон — потом открывается раздел (этап 6)
перед разделом:
  портфолио:
    - эмоция: smile
      текст: О, хочешь посмотреть, что я тут натворила?
    - эмоция: laugh
      текст: Сейчас покажу свои работы. Только не смотри на количество открытых вкладок.
    - эмоция: smile
      текст: Тут, кстати, самое интересное. Ну, я так считаю.
  обо мне:
    - эмоция: smile
      текст: А вот тут немного моего вдохновения.
    - эмоция: thinking
      текст: Люблю собирать всякие визуальные штуки. Иногда одна картинка может натолкнуть на целую идею.
    - эмоция: smile
      текст: Хочешь узнать, кто всё это собирает?
  контакты:
    - эмоция: smile
      текст: О, решил перейти от просмотра к делу? Мне нравится.
    - текст: Тут можно найти, как со мной связаться.
    - эмоция: laugh
      текст: Пиши, не кусаюсь. Ну, почти.

# Реплика, когда гость закрыл раздел (этап 6)
после раздела:
  портфолио:
    - эмоция: smile
      текст: Ну как тебе?
    - текст: Надеюсь, ты нашёл что-нибудь интересное.
    - эмоция: embarrassed
      текст: Всё посмотрел? А я там ещё кое-что не добавила…
  обо мне:
    - эмоция: smile
      текст: Ну вот, теперь ты знаешь обо мне чуть больше.
    - эмоция: embarrassed
      текст: Надеюсь, я не слишком много о себе рассказала.
    - эмоция: laugh
      текст: Теперь твоя очередь что-нибудь рассказать. Хотя ладно, не обязательно.
  контакты:
    - эмоция: smile
      текст: Ну что, будем работать вместе?
    - эмоция: smile
      текст: Буду ждать твоего сообщения!
    - текст: Надеюсь, ещё увидимся.

# Реакции на поведение гостя (этап 6)
реакции:
  долгая тишина:
    - эмоция: thinking
      текст: Ты там не уснул?
    - эмоция: smile
      текст: Можешь не торопиться, я никуда не ухожу.
    - эмоция: embarrassed
      текст: Кстати, я тоже иногда просто зависаю.
  снова осмотр:
    - эмоция: smile
      текст: Опять исследуешь мои владения?
    - эмоция: laugh
      текст: Кажется, ты уже знаешь эту комнату лучше меня.
    - эмоция: thinking
      текст: Нашёл что-нибудь интересное?
  много кликов:
    - эмоция: laugh
      текст: АХАХ, тебе всё интересно.
    - эмоция: smile
      текст: Так, я смотрю, ты решил проверить здесь каждый пиксель.
    - эмоция: laugh
      текст: Ну всё, теперь ты официальный исследователь моей комнаты.
