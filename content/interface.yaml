# Заглушка для телефонов
телефон:
  заголовок: Загляни ко мне с компьютера
  текст: Мой сайт — маленькая комната, и на большом экране в ней гораздо уютнее. Приходи с компьютера, там можно всё рассмотреть и покликать.

# Экран для вертикального планшета
планшет:
